appId: com.openphotobooth.app
productName: Open Photobooth
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{vitest.config.ts,tests/**/*,coverage/**/*}'
  - '!{CLAUDE.md,TECH_STACK.md,docs/**/*}'
asarUnpack:
  - resources/**
win:
  executableName: open-photobooth
  target:
    - target: nsis
      arch:
        - x64
linux:
  executableName: open-photobooth
  maintainer: Open Photobooth Contributors <ifndefinitely@github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: 'LICENSE'
  artifactName: '${productName}-${version}-setup.${ext}'
# Compression level for the NSIS installer package (build-time cost only, no effect on app startup).
# 'normal' = LZMA normal compression, good balance of installer size and build speed.
compression: normal
npmRebuild: false
